<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register | Desert Arts</title>
  <link rel="stylesheet" href="stylesheet.css" />
</head>
<body>
  <div class="wrapper"> 
    <nav>
      <img src="img/logo.png" alt="Desert Arts Logo" style="height: 80px;">
      <div>
        <a href="index.html">Home</a>
        <a href="events.html">Events</a>
        <a href="registration.html">Register</a>
         <a href="account.html">My Account</a>

      </div>
    </nav>

    <section class="section">
      <h2>Register</h2>
      <form onsubmit="handleSubmit(event)">
        <label for="name">Full Name</label>
        <input type="text" id="name" required />

        <label for="email">Email</label>
        <input type="email" id="email" required />

        <label for="pass">Password</label>
        <input type="pass" id="pass" required />

        <label for="address">Address</label>
        <input type="address" id="address" required />

        <label style="display: flex; align-items: center; gap: 10px; margin-top: 15px;">
        <input type="checkbox" name="terms" required />
        I agree to the <a href="/img/terms.jpeg" target="_blank">Terms and Conditions</a>.
        </label>

        <button type="submit">Submit Registration</button>
      </form>
    </section>

    <footer>
      <p>&copy; 2025 Desert Arts. All rights reserved.</p>
    </footer>

    <script src="script.js"></script>
  </div>
</body>
</html>
